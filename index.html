<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <!-- Primary / SEO -->
    <title>WordWalker – A Word Path Game</title>
    <meta name="description" content="WordWalker is a fast word game: type English words along a winding path, right then down, never repeat a word, and race the clock. Free, in your browser.">
    <meta name="keywords" content="wordwalker, word game, typing game, browser game, word puzzle, free online game, vocabulary game">
    <meta name="author" content="WarzeDev">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1">
    <link rel="canonical" href="https://wordwalker.warze.org/">
    <meta name="theme-color" content="#4caf7d">
    <meta name="color-scheme" content="dark">
    <meta name="application-name" content="WordWalker">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="logo.svg">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">

    <!-- Open Graph (Discord, Facebook, LinkedIn, Telegram, WhatsApp, Slack) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="WordWalker">
    <meta property="og:title" content="Wordwalker">
    <meta property="og:description" content="Type words along a winding path, never repeat one, and beat the clock.">
    <meta property="og:url" content="https://wordwalker.warze.org/">
    <meta property="og:locale" content="en_US">
    <meta property="og:image" content="https://wordwalker.warze.org/thumbnail.png">
    <meta property="og:image:secure_url" content="https://wordwalker.warze.org/thumbnail.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Wordwalker gameplay: a path of letter tiles winding right and down">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@warzedev">
    <meta name="twitter:creator" content="@warzedev">
    <meta name="twitter:title" content="WordWalker">
    <meta name="twitter:description" content="Type words along a winding path, never repeat one, and beat the clock.">
    <meta name="twitter:url" content="https://wordwalker.warze.org/">
    <meta name="twitter:image" content="https://wordwalker.warze.org/thumbnail.png">
    <meta name="twitter:image:alt" content="Wordwalker gameplay: a path of letter tiles winding right and down">

    <!-- Mobile / PWA-ish -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Wordwalker">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="format-detection" content="telephone=no">

    <!-- Structured data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "VideoGame",
      "name": "Wordwalker",
      "url": "https://wordwalker.warze.org/",
      "description": "Type English words along a winding path, never repeat a word, and race the clock.",
      "image": "https://wordwalker.warze.org/thumbnail.png",
      "genre": ["Word game", "Typing game", "Puzzle"],
      "gamePlatform": "Web browser",
      "applicationCategory": "Game",
      "operatingSystem": "Any",
      "inLanguage": "en",
      "isAccessibleForFree": true,
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Person", "name": "WarzeDev", "sameAs": ["https://x.com/warzedev", "https://github.com/WarzeDev"] }
    }
    </script>

    <link rel="stylesheet" href="style.css">
  </head>
  <body>
  <div id="hud">
    <div id="score">0</div>
    <div id="clock"><div id="clockbar"></div><span id="clocktext">30.0</span></div>
    <div id="words">0 words</div>
  </div>
  <div id="viewport"><div id="world"></div></div>
  <div id="tutorial"></div>
  <div id="toast"></div>
  <button id="mute" title="Mute">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi-volume-mute-fill" viewBox="0 0 16 16">
      <path d="M6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06m7.137 2.096a.5.5 0 0 1 0 .708L12.207 8l1.647 1.646a.5.5 0 0 1-.708.708L11.5 8.707l-1.646 1.647a.5.5 0 0 1-.708-.708L10.793 8 9.146 6.354a.5.5 0 1 1 .708-.708L11.5 7.293l1.646-1.647a.5.5 0 0 1 .708 0"/>
    </svg>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi-volume-up-fill" viewBox="0 0 16 16">
      <path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/>
      <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/>
      <path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06"/>
    </svg>
  </button>
  <button id="hint" title="Use hint [Keybind: 1]" aria-keyshortcuts="1" hidden>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-lightbulb" viewBox="0 0 16 16">
      <path d="M2 6a6 6 0 1 1 10.174 4.31c-.203.196-.359.4-.453.619l-.762 1.769A.5.5 0 0 1 10.5 13a.5.5 0 0 1 0 1 .5.5 0 0 1 0 1l-.224.447a1 1 0 0 1-.894.553H6.618a1 1 0 0 1-.894-.553L5.5 15a.5.5 0 0 1 0-1 .5.5 0 0 1 0-1 .5.5 0 0 1-.46-.302l-.761-1.77a2 2 0 0 0-.453-.618A5.98 5.98 0 0 1 2 6m6-5a5 5 0 0 0-3.479 8.592c.263.254.514.564.676.941L5.83 12h4.342l.632-1.467c.162-.377.413-.687.676-.941A5 5 0 0 0 8 1"/>
    </svg>
    <span id="hintnum">2</span>
  </button>
  <input id="kb" autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false">
  <div id="overlay">
    <h1>Wordwalker</h1>
    <div id="stats"></div>
    <p id="best"></p>
    <div id="modes">
      <button data-mode="normal">Normal</button>
      <button data-mode="marathon">Marathon</button>
      <button data-mode="hardcore">Hardcore</button>
    </div>
    <p id="modedesc"></p>
    <button id="start">Play</button>
  </div>
  <script src="game.js"></script>
  </body>
</html>
